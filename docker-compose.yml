x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-opspilot}@postgres:5432/${POSTGRES_DB:-opspilot}
  REDIS_URL: redis://redis:6379/0
  # Unset = /incidents and /webhooks return 503 (fail closed). Set it in .env.
  API_TOKEN: ${API_TOKEN:-}
  # Claude triage. Unset key = triage calls fail and are recorded on the analysis.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}

# Containers with this label get their logs shipped to Loki by Alloy.
x-ship-logs: &ship-logs
  opspilot.logs: "true"

services:
  # ---------------------------------------------------------------- OpsPilot
  api:
    build: .
    ports:
      - "8000:8000"
    environment: *app-env
    labels: *ship-logs
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *app-env
    labels: *ship-logs
    mem_limit: 256m
    depends_on:
      # api runs the migrations at startup; wait for it so the worker sees the schema.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Demo target
  demo-app:
    build: ./demo-app
    ports:
      - "8080:8000"
    environment:
      SERVICE_NAME: demo-app
      CHAOS_MAX_MEMORY_MB: "64"
    labels: *ship-logs
    mem_limit: 160m  # room for CHAOS_MAX_MEMORY_MB on top of the ~60 MB baseline

  traffic:
    # Steady ~2 req/s to /orders so error-rate alerts have something to measure.
    image: curlimages/curl:8.22.0
    entrypoint: ["sh", "-c", "while true; do curl -s -o /dev/null http://demo-app:8000/orders; sleep 0.5; done"]
    mem_limit: 32m
    depends_on:
      - demo-app

  # ---------------------------------------------------------------- Observability
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 256m

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - api_token  # mounted at /run/secrets/api_token, used as the webhook bearer token
    ports:
      - "9093:9093"
    mem_limit: 64m

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    mem_limit: 256m

  alloy:
    image: grafana/alloy:v1.21.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker socket to discover containers and read their logs.
      # Note: socket access is powerful; fine for a local laptop stack, not for production.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    depends_on:
      - loki

secrets:
  api_token:
    environment: API_TOKEN

volumes:
  pgdata:
  prometheus-data:
  loki-data:
